name = "signal-sync"
main = "worker.js"
compatibility_date = "2024-01-01"

# Create this with: wrangler kv namespace create SAVED_KV
# then paste the id it prints below.
kv_namespaces = [
  { binding = "SAVED_KV", id = "719661e9da164f7fa37ac79291328724" }
]


d1_databases = [
  { binding = "SIGNAL_DB", database_name = "signal-db", database_id = "3c051f20-7eb2-4c1e-962f-456b4f23623a" }
]

# The site at signaltechnews.com (Cloudflare Pages) calls the worker on its
# own origin. The workers.dev URL stays on for the old GitHub Pages copy and
# for the news push from GitHub Actions.
workers_dev = true
routes = [
  { pattern = "signaltechnews.com/api/*", zone_name = "signaltechnews.com" },
  { pattern = "signaltechnews.com/auth/*", zone_name = "signaltechnews.com" }
]

[vars]
# Site origins allowed to call the account API (comma-separated).
ALLOWED_ORIGIN = "https://signaltechnews.com,https://www.signaltechnews.com,https://primetimeplayer.github.io"
# Where sign-in and sign-out return the reader.
SITE_URL = "https://signaltechnews.com/"

# SYNC_TOKEN is a secret, NOT set here -- see the README in this folder.
# Set it with: wrangler secret put SYNC_TOKEN
# NEWS_INGEST_TOKEN is a secret too (same value as the GitHub Actions secret
# of that name). Set it with: wrangler secret put NEWS_INGEST_TOKEN
# News feeds are stored in SAVED_KV under keys news:v1:<REGION>:<language>.
