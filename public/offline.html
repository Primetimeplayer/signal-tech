<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>You're offline — Signal Tech</title>
<meta name="copyright" content="Signal Tech">
<meta name="author" content="Signal Tech">
<link rel="icon" href="assets/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Signal Tech">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f8f9fa; color: #202124; font-family: Inter, ui-sans-serif, system-ui, sans-serif; line-height: 1.6; }
  a { color: #185abc; }
  .mast { background: #ffffff; border-bottom: 1px solid #e5e7eb; }
  .wrap { width: min(800px, calc(100% - 32px)); margin: 0 auto; }
  .mast-row { display: flex; align-items: center; min-height: 64px; gap: 16px; }
  .wordmark { color: #202124; font-size: 22px; font-weight: 650; letter-spacing: -0.04em; text-decoration: none; }
  .wordmark span { color: #1a73e8; }
  main { padding: 48px 0; }
  p { margin: 0 0 16px; font-size: 15px; }
  footer { margin-top: 12px; padding: 16px 0 28px; color: #5f6368; font-size: 12px; }
  .footer-copy { margin: 0; font-size: 12px; }
  .skip-link{position:absolute;left:12px;top:8px;z-index:1000;padding:10px 14px;background:#1a73e8;color:#fff;border-radius:8px;font:600 14px/1 Inter,ui-sans-serif,system-ui,sans-serif;text-decoration:none;transform:translateY(-150%)}
  .skip-link:focus{transform:none;outline:2px solid #14294b;outline-offset:2px}
  #main:focus{outline:none}
</style>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="skipToMain">Skip to main content</a>
<header class="mast">
  <div class="wrap mast-row">
    <a class="wordmark" href="/">Signal<span>.</span> Tech</a>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1">
  <p data-i18n="offlineMessage">You're offline. Your saved stories are still here.</p>
  <p><a href="/" data-i18n="offlineHome">Back to home</a></p>
</main>
<footer>
  <div class="wrap">
    <p class="footer-copy" data-i18n="copyright">© 2026 Signal Tech. All rights reserved.</p>
  </div>
</footer>
<script src="ui-i18n.js"></script>
<script>
  (function () {
    var lang = 'en-US';
    try { lang = localStorage.getItem('language') || lang; } catch (e) {}
    if (window.SignalI18n) window.SignalI18n.apply(document, lang);
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' });
    });
  }
</script>
<script>
(function () {
  function stamp() {
    var year = String(new Date().getFullYear());
    var nodes = document.querySelectorAll('[data-i18n="copyright"]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = nodes[i].textContent.replace(/20\d{2}/, year);
    }
  }
  stamp();
  document.addEventListener('DOMContentLoaded', stamp);
  var lang = document.getElementById('languageSelect');
  if (lang) lang.addEventListener('change', function () { setTimeout(stamp, 0); });
})();
</script>
</body>
</html>
