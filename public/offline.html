<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>You're offline — Signal Tech</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Signal Tech">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f8f9fa; color: #202124; font-family: Inter, ui-sans-serif, system-ui, sans-serif; line-height: 1.6; }
  a { color: #185abc; }
  .mast { background: #ffffff; border-bottom: 1px solid #e5e7eb; }
  .wrap { width: min(800px, calc(100% - 32px)); margin: 0 auto; }
  .mast-row { display: flex; align-items: center; min-height: 64px; gap: 16px; }
  .wordmark { color: #202124; font-size: 22px; font-weight: 650; letter-spacing: -0.04em; text-decoration: none; }
  .wordmark span { color: #1a73e8; }
  main { padding: 48px 0; }
  p { margin: 0 0 16px; font-size: 15px; }
</style>
</head>
<body>
<header class="mast">
  <div class="wrap mast-row">
    <a class="wordmark" href="index.html">Signal<span>.</span> Tech</a>
  </div>
</header>
<main class="wrap">
  <p data-i18n="offlineMessage">You're offline. Your saved stories are still here.</p>
  <p><a href="index.html" data-i18n="offlineHome">Back to home</a></p>
</main>
<script src="ui-i18n.js"></script>
<script>
  (function () {
    var lang = 'en-US';
    try { lang = localStorage.getItem('language') || lang; } catch (e) {}
    if (window.SignalI18n) window.SignalI18n.apply(document, lang);
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' });
    });
  }
</script>
</body>
</html>
