<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Page not found — Signal Tech</title>
<!-- Self-contained on purpose: this page is served for missing URLs at any
     depth (/a/b/c), so it must not load relative CSS, JS or images. -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f8f9fa; color: #202124; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
  a { color: #185abc; }
  .mast { background: #ffffff; border-bottom: 1px solid #e5e7eb; }
  .wrap { width: min(800px, calc(100% - 32px)); margin: 0 auto; }
  .mast-row { display: flex; align-items: center; min-height: 64px; gap: 16px; }
  .wordmark { color: #202124; font-size: 22px; font-weight: 650; letter-spacing: -0.04em; text-decoration: none; }
  .wordmark span { color: #1a73e8; }
  main { padding: 48px 0; }
  h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -0.02em; }
  p { margin: 0 0 16px; font-size: 15px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px 20px; padding: 0; margin: 24px 0 0; list-style: none; font-size: 15px; font-weight: 600; }
  footer { margin-top: 12px; padding: 16px 0 28px; color: #5f6368; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    body { background: #010C2C; color: #e8eaed; }
    a { color: #8ab4f8; }
    .mast { background: #071436; border-bottom-color: #1f2a4d; }
    .wordmark { color: #e8eaed; }
    .wordmark span { color: #8ab4f8; }
    footer { color: #9aa0a6; }
  }
  .skip-link{position:absolute;left:12px;top:8px;z-index:1000;padding:10px 14px;background:#1a73e8;color:#fff;border-radius:8px;font:600 14px/1 Inter,ui-sans-serif,system-ui,sans-serif;text-decoration:none;transform:translateY(-150%)}
  .skip-link:focus{transform:none;outline:2px solid #fff;outline-offset:2px}
  #main:focus{outline:none}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="mast">
  <div class="wrap mast-row">
    <a class="wordmark" id="nf-wordmark" href="https://signaltechnews.com/" data-path="">Signal<span>.</span> Tech</a>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1">
  <h1>Page not found</h1>
  <p>We can't find that page. It may have moved, or the link may be mistyped.</p>
  <ul class="links">
    <li><a id="nf-home" href="https://signaltechnews.com/" data-path="">Latest stories</a></li>
    <li><a href="https://signaltechnews.com/digests" data-path="digests">Weekly digests</a></li>
    <li><a href="https://signaltechnews.com/about" data-path="about">About Signal Tech</a></li>
  </ul>
</main>
<footer>
  <div class="wrap">© 2026 Signal Tech. All rights reserved.</div>
</footer>
<script>
  // Point the links at this host's site root: /signal-tech/ on GitHub Pages,
  // / everywhere else.
  (function () {
    var root = location.pathname.indexOf('/signal-tech/') === 0 ? '/signal-tech/' : '/';
    var links = document.querySelectorAll('a[data-path]');
    for (var i = 0; i < links.length; i++) links[i].setAttribute('href', root + links[i].getAttribute('data-path'));
  })();
</script>
</body>
</html>
