name: Generate Weekly Digest

on:
  schedule:
    - cron: '0 14 * * 1'   # every Monday at 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the sitemap can use real last-modified dates

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build static issue and digest pages, feed and sitemap
        run: node scripts/build-static-pages.js
        continue-on-error: true

      - name: Commit digest
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/digests/ public/data/issue-archive.json public/issues/ public/issues.html public/feed.xml public/sitemap.xml
          git diff --staged --quiet || git commit -m "Add weekly digest"
          git push
