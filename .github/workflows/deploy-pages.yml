name: Deploy to GitHub Pages

# The site lives at https://signaltechnews.com/ (Cloudflare Pages). GitHub
# Pages now only serves redirect pages for the old
# primetimeplayer.github.io/signal-tech/ URLs; see
# scripts/build-ghpages-redirect.js.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-ghpages-redirect.js _ghpages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _ghpages
      - id: deployment
        uses: actions/deploy-pages@v4
